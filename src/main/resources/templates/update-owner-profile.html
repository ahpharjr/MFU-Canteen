<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/styles/edit-user-profile.css">
    <link rel="stylesheet" href="/styles/create-item.css">
</head>
<body>
    <div class="profile-edit-container">
        <form id="updateProfileForm" th:action="@{'/owner/'+ ${owner.ownerId} + '/edit-profile'}" th:object="${owner}"
            method="post" enctype="multipart/form-data">
            <!-- Profile Edit Form -->
            <div class="profile-form">
                <input type="hidden" id="ownerIdField" name="ownerId" th:value="${owner.ownerId}"/>
                <h2>Profile</h2>
                <div class="profile-image-section">
                    <img class="profile-image" id="imagePreview" th:src="${owner.profilePicture}" alt="Picture">
                </div>
                <div class="custom-div">
                    <label class="custom-file-upload">
                        <input type="file" name="image" id="imageUpload" accept="image/*" onchange="previewImage()">
                        Tap here to Update Profile
                    </label>
                </div>
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" name="name" th:field="*{name}" placeholder="Enter your name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" name="email" th:field="*{email}" required>
                </div>
                <div class="form-row">
                    <label for="tel">Phone Number</label>
                    <input type="tel" name="phNum" th:field="*{phNum}">
                </div>
                <div class="button-group">
                    <button type="button" class="cancel-button" onclick="window.history.back();">Cancel</button>
                    <button type="submit" class="update-button">Update</button>
                </div>
             </form>
        </div>
    </div>
    <script>
            function previewImage() {
                const imageInput = document.getElementById('imageUpload');
                const imagePreview = document.getElementById('imagePreview');
                
                if (imageInput.files && imageInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(imageInput.files[0]);
                }
            }

            document.getElementById('updateProfileForm').onsubmit = async function (event) {
                event.preventDefault();

                const formData = new FormData(event.target);
                const ownerId = document.getElementById("ownerIdField").value;

                try {
                    const response = await fetch(`/owner/${ownerId}/edit-profile`, {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) throw new Error("Failed to update profile");

                    const updatedOwner = await response.json();
                    if (!updatedOwner) throw new Error("Received null response for updated profile");

                    event.target.reset();
                    window.location.href = `/owner/${ownerId}/home`;

                } catch (error) {
                    console.error("Error updating profile:", error);
                }

            }
    </script>
</body>
</html>
