<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Menu</title>
    <link rel="stylesheet" href="/styles/menu-container.css">
    <link rel="stylesheet" href="/styles/header-o.css">
    <link rel="stylesheet" href="/styles/toggle.css">
    <link rel="stylesheet" href="/styles/profile-box.css">
</head>
<body>

    <div class="div-header">
        <div class="div-left-h">
            <div class="custom-circle2"><img src="/images/Ellipse 1220.png" alt="custom"></div>
            <div class="shop-name">
                <select id="shopSelect" onchange="handleShopChange()">
                    <option value="">Select Shop</option>
                    <th:block th:each="shop : ${shops}">
                        <option th:value="${shop.shopId}" th:text="${shop.name}"></option>
                    </th:block>
                </select>
            </div>
            
            <div class="shop-toggle">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                    <span class="status"></span>
                </label>
            </div>
        </div>
        <div class="div-right-h">
            <div class="menu-icon">
                <img src="/icons/icons8-menu-50.png" alt="menu">
                <span class="tooltip">Menu</span>
            </div>
            <div class="order-icon">
                <span class="order-qty">9</span>
                <img src="/icons/notifications.svg" alt="order">
                <span class="tooltip">Order</span>
            </div>
            <div class="profile-container">
                <div class="profile" onclick="toggleProfileCard()">
                    <img src="/icons/profile.png" alt="profile">
                    <span class="tooltip">Profile</span>
                </div>
                <div class="profile-card">
                    <h2>PROFILE</h2>
                    <a href="#" class="edit-link">
                        <img src="/icons/icons8-edit-32.png">
                        <span class="tooltip">Edit</span>
                    </a>
                    <div class="profile-header">
                        <img src="/images/4k-mercedes-red-zcj47yx9mq7tfjed.webp" alt="Profile Picture" class="profile-image">
                    </div>
                    <div class="profile-info">
                        <h3>Jesicca Elsanar</h3>
                        <p>Jesiccaesanar2003@gmail.com</p>
                        <button class="signout-button">Sign out</button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <div class="div-menu-container">
        <h2>Menu</h2>
        <a id="createItemLink" href="#">
            <div class="create-item-button">
                <img src="/icons/create-item-icon.png"> Create Item
            </div>
        </a>
        <div class="div-menu-box" id="menuBox">
            <!-- Items will be loaded here dynamically -->
        </div>
    </div>
    <input type="hidden" id="ownerIdField" th:value="${ownerId}">
    <script>
        // Function to load items when a shop is selected
        function loadItemsForShop(shopId) {
            const createItemLink = document.getElementById("createItemLink");
            const ownerId = document.getElementById("ownerIdField").value;
            createItemLink.href = `/owner/shop/${shopId}/create-item?ownerId=${ownerId}`;

            // Fetch items for the selected shop
            fetch(`/owner/shop/${shopId}/items`)
                .then(response => response.json())
                .then(items => {
                    const menuBox = document.getElementById("menuBox");
                    menuBox.innerHTML = ""; // Clear previous items
                    items.forEach(item => {
                        const itemHtml = `
                            <div class="menu-card">
                                <img src="${item.imageUrl}" alt="${item.name}" class="menu-image">
                                <div class="toggle">
                                    <label class="switch">
                                        <input type="checkbox" ${item.available ? 'checked' : ''}>
                                        <span class="slider"></span>
                                        <span class="status">${item.available ? 'ON' : 'OFF'}</span>
                                    </label>
                                </div>
                                <div class="menu-info">
                                    <p>${item.name}</p>
                                    <div class="info-bottom">
                                        <div class="rating">
                                            <img src="/images/rating-star.png">
                                        </div>
                                        <div class="price-update">
                                            <img class="thai-baht" src="/icons/icons8-thai-baht-24.png">
                                            <span class="price">${item.price.toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                        menuBox.insertAdjacentHTML('beforeend', itemHtml);
                    });
                });
        }

        // Function to handle shop selection change and save to localStorage
        function handleShopChange() {
            const shopId = document.getElementById("shopSelect").value;
            if (shopId) {
                localStorage.setItem('selectedShopId', shopId);  // Save selected shop ID
                loadItemsForShop(shopId);
            } else {
                localStorage.removeItem('selectedShopId');  // Clear storage if no shop selected
                document.getElementById("menuBox").innerHTML = "";
                document.getElementById("createItemLink").href = "#";
            }
        }

        // On page load, check if a shop ID was previously selected
        window.onload = function() {
            const savedShopId = localStorage.getItem('selectedShopId');
            if (savedShopId) {
                document.getElementById("shopSelect").value = savedShopId; // Set saved shop as selected
                loadItemsForShop(savedShopId); // Load items for the saved shop
            }
        }
    </script>
    <script>
        function toggleProfileCard() {
            const profileCard = document.querySelector('.profile-card');
            profileCard.style.display = profileCard.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
