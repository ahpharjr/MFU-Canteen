<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Menu</title>
    <link rel="stylesheet" href="/styles/menu-container.css">
    <link rel="stylesheet" href="/styles/header-o.css">
    <link rel="stylesheet" href="/styles/toggle.css">
    <link rel="stylesheet" href="/styles/profile-box.css">
</head>
<body>

    <!-- Header Section -->
    <div class="div-header">
        <!-- Left Header with Shop Selection -->
        <div class="div-left-h">
            <div class="custom-circle2">
                <img src="/images/Ellipse 1220.png" alt="custom">
            </div>

            <!-- Shop Selection Dropdown -->
            <div class="shop-name">
                <select id="shopSelect" onchange="handleShopChange()">
                    <!-- <option value="">Select Shop</option> -->
                    <th:block th:each="shop : ${shops}">
                        <option th:value="${shop.shopId}" th:text="${shop.name}"></option>
                    </th:block>
                </select>
            </div>

            <!-- Shop Toggle Switch -->
            <div class="shop-toggle">
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                    <span class="status"></span>
                </label>
            </div>
        </div>

        <!-- Right Header with Menu, Order, and Profile Icons -->
        <div class="div-right-h">
            <!-- Menu Icon -->
            <div class="menu-icon">
                <img src="/icons/icons8-menu-50.png" alt="menu">
                <span class="tooltip">Menu</span>
            </div>

            <!-- Order Icon with Quantity Indicator -->
             <a id="viewOrderLink" href="#">
                <div class="order-icon">
                    <span class="order-qty">9</span>
                    <img src="/icons/notifications.svg" alt="order">
                    <span class="tooltip">Order</span>
                </div>
             </a>

            <!-- Profile Section -->
            <div class="profile-container">
                <div class="profile" onclick="toggleProfileCard()">
                    <img th:src="${owner.profilePicture}" alt="profile">
                    <span class="tooltip">Profile</span>
                </div>

                <!-- Profile Card Dropdown -->
                <div class="profile-card">
                    <h2>PROFILE</h2>
                    <a th:href="@{'/owner/' + ${ownerId} + '/edit-profile'}" class="edit-link">
                        <img src="/icons/icons8-edit-32.png" alt="edit">
                        <span class="tooltip">Edit</span>
                    </a>
                    <div class="profile-header">
                        <img th:src="${owner.profilePicture}" alt="Profile Picture" class="profile-image">
                    </div>
                    <div class="profile-info">
                        <h3 th:text="${owner.name}">Owner's Name</h3>
                        <p th:text="${owner.email}">Owner's Email</p>
                        <button class="signout-button">Sign out</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Menu Section -->
    <div class="div-menu-container">
        <h2>Menu</h2>
        <a class="create-item-link" id="createItemLink" href="#">
            <div class="create-item-button">
                <img src="/icons/create-item-icon.png" alt="Create Item"> Create Item
            </div>
        </a>

        <!-- Menu Items Display -->
        <div class="div-menu-box" id="menuBox">
            <!-- Items will be loaded here dynamically -->
        </div>
    </div>

    <!-- Hidden Owner ID Field -->
    <input type="hidden" id="ownerIdField" th:value="${ownerId}">

    <!-- JavaScript -->
    <script src="/script/menu.js"></script>
</body>
</html>
