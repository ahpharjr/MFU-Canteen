<!DOCTYPE html>
<html>
    <head>
        <title>Edit Shop</title>

    </head>
    <body>
        <form th:action="@{'/shop/edit/' + ${shop.shopId}}" method="post" enctype="multipart/form-data">
            <label for="name">Shop Name:</label>
            <input type="text" id="name" name="name" th:value="${shop.name}" required><br><br>
    
            <label for="shopNum">Shop Number:</label>
            <input type="text" id="shopNum" name="shopNum" th:value="${shop.shopNum}" required><br><br>
    
            <label for="description">Description:</label>
            <textarea id="description" name="description" th:text="${shop.description}" required></textarea><br><br>
    
            <label for="phNum">Phone Number:</label>
            <input type="text" id="phNum" name="phNum" th:value="${shop.phNum}" required><br><br>
            
            <div>
                <img th:src="@{${shop.picture}}" alt="Shop Picture" style="width:100px;height:100px;">
            </div>
            <label for="pictureFile">Shop Picture:</label>
            <input type="file" id="pictureFile" name="pictureFile"><br><br>
    
            <!-- Submit button -->
            <button type="submit">Update Shop</button>
            
            <!-- Cancel button - Redirects back to the canteen's list of shops -->
            <!-- <button type="button" onclick="window.location.href='/canteen/shops/' + [[${canteenId}]]">Cancel</button> -->
            <a th:href="@{'/canteen/shops/' + ${canteenId}}">
                <button type="button">Cancel</button>
            </a>
            
    

        </form>
    </body>
    
</html>
