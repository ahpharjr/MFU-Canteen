<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shops</title>
</head>
<body>
    <h1>Your Shops</h1>
    <table>
        <thead>
            <tr>
                <th>Shop Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="shop : ${shops}">
                <td th:text="${shop.name}"></td>
                <td>
                    <a th:href="@{/owner/shop/{shopId}/items(shopId=${shop.shopId})}">View Items</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
