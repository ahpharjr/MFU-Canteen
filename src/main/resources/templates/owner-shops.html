<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shops</title>
    <title>Canteen List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>[[${owner.name}]]'s Shops</h1>
    <p><a th:href="@{/ad/canteens}">Back to Canteens</a></p>
    <table>
        <thead>
            <tr>
                <th>Shop Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="shop : ${shops}">
                <td th:text="${shop.name}"></td>
                <td>
                    <a th:href="@{/owner/shop/{shopId}/items(shopId=${shop.shopId})}">View Items</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
