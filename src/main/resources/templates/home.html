<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/styles/home.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/menu.css">
    <style>
        .notification {
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: white;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 14px;
    z-index: 1000;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    opacity: 0.9;
    transition: opacity 0.5s ease-in-out;
}

.notification.success {
    background-color: #4caf50;
}

.notification.error {
    background-color: #f44336;
}

    </style>
</head>
<body>
    <!-- Header with Canteen Selection and User Actions -->
    <div class="header">
        <div class="hleft">
            <div>Location</div>
            <div class="canteen-name">
                <select id="canteenSelect" onchange="fetchShopsAndItems()">
                    <!-- <option value="">Select Canteen</option> -->
                    <th:block th:each="canteen : ${canteens}">
                        <option th:value="${canteen.canteenId}" th:text="${canteen.name}"></option>
                    </th:block>
                </select>
            </div>
        </div>
        <div class="hright">
            <div class="left-section">
                <div class="custom-circle-text">Find the <br> Food around you</div>
                <img class="custom-circle" src="/images/Ellipse 1220.png" alt="Custom Circle">

            </div>
            <div class="middle-section">
                <div class="search-icon"><img src="/icons/icons8-search-50 (1).png" alt="Search Icon"></div>
                <div class="input-search">
                    <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchItems()">
                </div>                
            </div>
            <div class="right-section">
                <div class="cart-icon">
                    <span class="cart-total-qty" th:text="${totalQuantity}">0</span>
                    <a th:href="@{'/user/'+${userId}+'/cart'}"><img src="/icons/cart.png" alt="Cart Icon"></a>
                </div>
                <div class="bell-icon">
                    <span class="cart-total-qty">9</span>
                    <img src="/icons/BELL NOTI.png" alt="Notification Bell">
                </div>
                <div class="profile-button"><img src="/icons/profile.png" alt="Profile"></div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="div-nav-bar">
        <div class="nav-button">
            <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon"><img  src="/icons/icons8-home-48.png" alt="home button"></div></a>
            <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon1"><img  src="/icons/icons8-home-48.png" alt="home button"></div></a>
        </div>
        <div class="nav-button">
            <div class="nav-icon"><img  id="menu-icon" src="/icons/menu-icon-color.png" alt="home button"></div>
            <div class="nav-icon1"><img  id="menu-icon" src="/icons/menu-icon.png" alt="home button"></div>
        </div>
        <div class="nav-button">
            <div class="nav-icon"><img  src="/icons/icons8-heart-50 (1).png" alt="home button"></div>
            <div class="nav-icon1"><img  src="/icons/icons8-heart-50.png" alt="home button"></div>
        </div>
        <div class="nav-button">
            <a th:href="@{'/user/'+ ${userId} + '/orders'}">
                <img  id="history-icon" src="/icons/history-icon.png" alt="home button"></div>
            </a><div class="nav-icon">
            <!-- <div class="nav-icon1"><img  id="history-icon" src="/icons/history-icon.png" alt="home button"></div> -->
        </div>
    </div>

    <!-- Category Buttons -->
    <div class="div-menu">
        <button class="category-button active" onclick="filterByCategory('')">Recommended Dishes</button>
        <button class="category-button" onclick="filterByCategory('Rice Bowls')">Rice Bowls</button>
        <button class="category-button" onclick="filterByCategory('Drinks')">Drinks</button>
        <button class="category-button" onclick="filterByCategory('Grilled & BBQ')">Grilled & BBQ</button>
        <button class="category-button" onclick="filterByCategory('Juice/Smoothies')">Juice/Smoothies</button>
    </div>

    <!-- Recommended and Shops Sections -->
    <div class="recommended-food-container1">
        <div id="recommendedText" class="recommended-text">Recommended Dishes</div>
        <div id="recommendedFoodContainer1" class="food-container1"></div>
        <div id="recommendedFoodContainer2" class="food-container2"></div>
    </div>
    
    <div class="shops-in-canteen">
        <div class="recommended-text">Shops in <span id="selectedCanteenName" th:text="${selectedCanteenName}"></span></div>
        <div id="shopContainer" class="food-container1"></div>
    </div>

    <input type="hidden" id="userIdField" th:value="${userId}">
    
    <script>
        const userId = document.getElementById("userIdField").value;
    </script>
    <script src="/script/home.js"></script>
</body>
</html>
