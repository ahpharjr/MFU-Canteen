     <body>
        <div class="header">
            <div class="hleft">
                <div>Location</div>
                <div>
                    <select id="canteenSelect" onchange="fetchShopsAndItems()">
                        <option value="">Select Canteen</option>
                        <!-- Iterate through canteens and create options -->
                        <th:block th:each="canteen : ${canteens}">
                            <option th:value="${canteen.canteenId}" th:text="${canteen.name}"></option>
                        </th:block>
                    </select>
                </div>
            </div>
            <div class="hright">
                <div class="left-section">Find the <br> Food around you</div>
                <div class="middle-section">
                    <input type="text" placeholder="Search...">
                </div>
                <div class="right-section">right</div>
            </div>
        </div>
    
        <div class="recommended-food-container1">
            <div class="recommended-text">Shops in <span id="selectedCanteenName" th:text="${selectedCanteenName}"></span></div>
            <div id="shopContainer" class="food-container1"></div>
        </div>
    
        <div class="recommended-food-container1">
            <div class="recommended-text">Recommended Dishes</div>
            <div id="recommendedFoodContainer" class="food-container1"></div>
        </div>
    
        <script>
            function fetchShopsAndItems() {
                const canteenId = document.getElementById("canteenSelect").value;
                const selectedCanteenName = document.getElementById("canteenSelect").options[document.getElementById("canteenSelect").selectedIndex].text;
                document.getElementById("selectedCanteenName").innerText = selectedCanteenName;
    
                if (canteenId) {
                    fetch(`/user/canteen/shops/${canteenId}`)
                        .then(response => response.json())
                        .then(data => {
                            console.log('Shops:', data); // Debugging
                            displayShops(data);
                        })
                        .catch(error => console.error('Error fetching shops:', error));
    
                    fetch(`/user/canteen/shops/${canteenId}/items`)
                        .then(response => response.json())
                        .then(data => {
                            console.log('Recommended Dishes:', data); // Debugging
                            displayRecommendedDishes(data);
                        })
                        .catch(error => console.error('Error fetching recommended dishes:', error));
                } else {
                    document.getElementById("shopContainer").innerHTML = ""; // Clear shops
                    document.getElementById("recommendedFoodContainer").innerHTML = ""; // Clear recommended foods
                }
            }
    
            function displayShops(shops) {
                const shopContainer = document.getElementById("shopContainer");
                shopContainer.innerHTML = ""; // Clear previous shops
                shops.forEach(shop => {
                    const shopBox = `
                        <div class="recommended-food-box">
                            <div class="item-pic"><img src="${shop.picture}" alt="${shop.name}"></div>
                            <div class="item-title">
                                <div class="dish-name">${shop.name}</div>
                            </div>
                        </div>`;
                    shopContainer.innerHTML += shopBox;
                });
            }
    
            function displayRecommendedDishes(items) {
                console.log('in fetch item function ----------------');
                const recommendedFoodContainer = document.getElementById("recommendedFoodContainer");
                recommendedFoodContainer.innerHTML = ""; // Clear previous items
                console.log('in fetch item function ----------------1');
                items.forEach(item => {
                    console.log('in fetch item function ----------------2');
                    const itemBox = `
                        <div class="recommended-food-box">
                            <div class="item-pic"><img src="${item.imageUrl}" alt="${item.name}"></div>
                            <div class="item-title">
                                <div class="dish-name">${item.name}</div>
                                <div class="dish-price">$${item.price.toFixed(2)}</div>
                            </div>
                        </div>`;
                    recommendedFoodContainer.innerHTML += itemBox;
                });
            }
        </script>
    </body>
    

</html>
