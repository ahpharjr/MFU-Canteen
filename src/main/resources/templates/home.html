<!DOCTYPE html>
<html>
    <head>
        <title> Home Page</title>
        <!-- <link rel="stylesheet" href="styles/header.css">
        <link rel="stylesheet" href="styles/recommendedFood.css"> -->
        <style>
                body{
                padding: 0;
                margin: 0;
                background-color: cadetblue;
                }
                .header{
                    display: flex;

                }
                .hleft{
                    width: 120px;
                    height: 65px;
                    border-radius: 5px;
                    margin: 0px 5px 0px 0px;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    padding-left: 15px;
                    box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
                }
                .hright{
                    flex: 1;
                    border-radius: 5px;
                    box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.3);
                    display: flex;
                }
                .left-section{
                    width: 200px;
                    font-size: 25px;
                    padding: 5px 0px 0px 15px;
                    color: white;
                }
                .middle-section{
                    flex: 1;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }


                /* ==================For the navigation bar ===============================*/
                .div-nav-bar{
                    position: absolute;
                    display: flex;
                    flex-direction: column;
                    border: 1px solid coral;
                    top: 72px;
                    justify-content: space-evenly;
                    align-items: center;
                    height: 200px;
                    width: 40px;
                    border-radius: 10px;
                }
                .nav-button{
                    position: relative;
                }
                .nav-button img{
                    height: 20px;
                }
                .nav-icon{
                    position: absolute;
                    top: 0;
                }
                .nav-icon{
                    opacity: 0;
                    transition: 0.3s ease;
                }
                .nav-icon:hover{
                    opacity: 1;
                    cursor: pointer;
                }
                #menu-icon, #history-icon{
                    height: 15px;
                }
                .right-section{
                    width: 200px;
                }
                .recommended-food-container{
                background-color: white;
                border-radius: 10px;
                margin: 20px 80px;
                height: 700px;
                }
                /* ======================Below is for the .recommended-food in home page================ */
                .recommended-food-container1{
                    background-color:cadetblue;
                    border-radius: 10px;
                    margin: 7px 0 20px 50px;
                    height: 700px;
                }
                /* ======================Above is for the .recommended-food in home page================ */
                .recommended-text{
                    display: flex;
                    height: 50px;
                    align-items: center;
                    padding-left: 40px;
                    font-weight: 600;
                }
                .food-container1, .food-container2 {
                    display: flex;
                    overflow-x: auto;  /* Enables horizontal scrolling */
                    overflow-y: hidden;  /* Prevents vertical scrolling */
                    white-space: nowrap;  /* Prevents wrapping of items */
                    padding: 0 20px; 
                    /* -ms-overflow-style: none;  Hides scrollbar in IE and Edge */
                    /* scrollbar-width: none;     Hides scrollbar in Firefox */
                }
                .food-container2{
                    margin-top: 20px;
                }
                /*.food-container::-webkit-scrollbar {
                    display: none;  Hides the scrollbar in WebKit browsers 
                }*/

                /* Style for the entire scrollbar */
                .food-container1::-webkit-scrollbar, 
                .food-container2::-webkit-scrollbar  {
                    height: 8px;  /* Adjusts the height of the scrollbar */
                }

                /* Style for the scrollbar track (background) */
                .food-container1::-webkit-scrollbar-track, 
                .food-container2::-webkit-scrollbar-track {
                    background: #ffffff;  /* Light grey background for the scrollbar track */
                    border-radius: 10px;
                }

                /* Style for the scrollbar thumb (the draggable part) */
                .food-container1::-webkit-scrollbar-thumb,
                .food-container2::-webkit-scrollbar-thumb {
                    background-color: #d3d3d3;  /* Darker color for the thumb */
                    border-radius: 10px;     /* Rounded corners for the scrollbar thumb */
                    border: 2px solid #f1f1f1;  /* Adds some space around the thumb */
                }

                /* Hover effect for the scrollbar thumb */
                .food-container1::-webkit-scrollbar-thumb:hover,
                .food-container2::-webkit-scrollbar-thumb:hover {
                    background-color: #afafaf;  /* Darkens the thumb when hovered */
                }

                .recommended-food-box{
                    display: flex;
                    flex-direction: column;
                    min-width: 320px;
                    height: 289px;
                    margin: 0 0 10px 40px;
                    border-radius: 10px;
                    box-shadow: 0px 3px 4px rgba(0, 0,0,0.3);
                    position: relative;
                    transition: 0.3s ease;
                }
                .recommended-food-box:hover{
                    box-shadow: 5px 8px 10px rgba(0, 0,0,0.5);
                }
                .add-to-favorite{
                    position: absolute;
                    top: 20px;
                    right: 7px;
                }
                .heart-shape{
                    position: relative;
                }
                .heart-shape img{
                    width: 23px;
                }
                .color-heart{
                    position: absolute;
                    top: 0;
                    opacity: 0;
                    transition: 0.3s ease;
                }
                .color-heart:hover{
                    opacity: 1;
                    cursor: pointer;
                }
                .add-button{
                    position: absolute;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 20px;
                    height: 20px;
                    border-radius: 3px;
                    border: solid 1px rgb(0, 0, 0);
                    top: 50px;
                    right: 8px;
                    color: rgb(0, 0, 0);
                    transition: 0.3s ease;
                }
                .add-button:hover{
                    color: white;
                    background-color: rgba(242, 114, 28,1);
                    border: 1px solid white;
                    cursor: pointer;
                }
                .item-pic{
                    display: flex;
                    height: 209px;
                    border-radius: 10px;
                }
                .item-pic img{
                    width: 100%;
                    height: 209px;
                    object-fit: cover;
                    border-radius: 10px;
                }
                .item-title{
                    display: flex;
                    justify-content: space-between;
                    height: 80px;
                }
                .item-name{
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    padding-left: 10px;
                }
                .dish-name{
                    padding-bottom: 5px;
                }
                .item-price{
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding-right: 15px;
                    font-size: 20px;
                }
                .thai-baht-icon img{
                    width: 20px;
                }

        </style>
    </head>

    </body>
