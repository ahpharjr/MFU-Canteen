<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <link rel="stylesheet" href="/styles/create-item.css">
    <link rel="stylesheet" href="/styles/edit-item.css">
    <link rel="stylesheet" href="/styles/profile-box.css">
</head>
<body>

    <div class="container">
        <!-- Delete Button with Icon -->
        <div class="delete-item" onclick="deleteItem()">
            <img src="/icons/icons8-delete-24.png" alt="Delete Icon">
            <span class="delete-tooltip">Delete</span>
        </div>
        <span class="title-text">Edit Item</span>
        <form id="editItemForm" th:action="@{'/owner/shop/' + ${shopId} + '/edit-item/' + ${item.itemId}}" 
              th:object="${item}" method="post" enctype="multipart/form-data">
              
            <input type="hidden" id="shopIdField" name="shopId" th:value="${shopId}" />
            <input type="hidden" id="ownerIdField" name="ownerId" th:value="${ownerId}" />
            <input type="hidden" id="itemIdField" name="itemId" th:value="${item.itemId}" />

            <!-- Image Upload Section -->
            <div class="div-upload-box">
                <div class="upload-box">
                    <!-- <input type="file" name="image" id="imageUpload" accept="image/*" onchange="previewImage()"> -->
                    <img id="imagePreview" th:src="${item.imageUrl}">
                </div>
                <div>
                    <label class="custom-file-upload">
                        <input type="file" name="image" id="imageUpload" accept="image/*" required onchange="previewImage()">
                        Tap here to Update Image
                    </label>
                </div>
            </div>

            <!-- Form Fields for Item Details -->
            <div class="form-group">
                <label for="food-name">Food Name</label>
                <input type="text" id="food-name" th:field="*{name}" required>
            </div>

            <div class="form-group-row">
                <div class="form-group category-group">
                    <label for="category">Category</label>
                    <select id="category" th:field="*{category}" required>
                        <option value="Chicken Rice">Chicken Rice</option>
                        <option value="Rice Bowls">Rice Bowls</option>
                    </select>
                </div>
                <div class="form-group price-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" th:field="*{price}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" required></textarea>
            </div>

            <!-- Update and Cancel Buttons -->
            <div class="button-group">
                <button type="button" class="cancel-button" onclick="window.history.back();">Cancel</button>
                <button type="submit" class="update-button">Update</button>
            </div>
        </form>
    </div>

    <!-- JavaScript for Image Preview and Form Submission -->
    <script>
        function previewImage() {
            const imageInput = document.getElementById('imageUpload');
            const imagePreview = document.getElementById('imagePreview');
            
            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(imageInput.files[0]);
            }
        }

        document.getElementById('editItemForm').onsubmit = async function (event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const shopId = document.getElementById("shopIdField").value;
            const ownerId = document.getElementById("ownerIdField").value;
            const itemId = document.getElementById("itemIdField").value;

            try {
                const response = await fetch(`/owner/shop/${shopId}/edit-item/${itemId}?ownerId=${ownerId}`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) throw new Error("Failed to update item");

                const updatedItem = await response.json();
                
                event.target.reset();
                document.getElementById('imagePreview').style.display = 'none';
                window.location.href = `/owner/${ownerId}/home`;

            } catch (error) {
                console.error("Error updating item:", error);
            }
        };


    function getCsrfTokenFromCookie() {
    const csrfCookie = document.cookie
        .split('; ')
        .find(row => row.startsWith('XSRF-TOKEN='));
    return csrfCookie ? csrfCookie.split('=')[1] : null;
}

async function deleteItem() {
    const shopId = document.getElementById("shopIdField").value;
    const ownerId = document.getElementById("ownerIdField").value;
    const itemId = document.getElementById("itemIdField").value;
    const csrfToken = getCsrfTokenFromCookie();  // Retrieve CSRF token from cookie
    console.log("token:" + csrfToken);
    if (!confirm("Are you sure you want to delete this item?")) return;

    try {
        const response = await fetch(`/owner/shop/${shopId}/delete-item/${itemId}`, {
            method: 'DELETE',
            headers: {
                'X-XSRF-TOKEN': csrfToken // Send the CSRF token in the header
            }
        });

        if (!response.ok) throw new Error("Failed to delete item");

        alert("Item deleted successfully");
        window.location.href = `/owner/${ownerId}/home`;

    } catch (error) {
        console.error("Error deleting item:", error);
        alert("Error deleting item. Please try again.");
    }
}

    </script>

</body>
</html>
