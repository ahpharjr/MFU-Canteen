<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Items in Shop</h1>
    <div>
        <a href="/owner/shop/${shopId}/add-item" class="btn">Add New Item</a>
    </div>
    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Price</th>
                <th>Availability</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="item : ${items}">
                <tr>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.price}"></td>
                    <td th:text="${item.availability} ? 'Available' : 'Not Available'"></td>
                    <td th:text="${item.category}"></td>
                    <td>
                        <a th:href="@{/owner/item/edit/{itemId}(itemId=${item.itemId})}">Edit</a>
                        <form th:action="@{/owner/item/delete/{itemId}(itemId=${item.itemId})}" method="post" style="display:inline;">
                            <button type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </th:block>
        </tbody>
    </table>
</body>
</html>
