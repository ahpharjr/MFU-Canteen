<!DOCTYPE html>
<html>
    <head>
        <title>Edit Canteen</title>
    </head>
    <body>
        <h1>Edit Canteen</h1>
        <form th:action="@{'/canteen/edit/' + ${canteen.canteenId}}" th:object="${canteen}" method="post">
            <label>Canteen Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter canteen name" required><br><br>

            <labe>Canteen Location</labe>
            <input type="text" th:field="*{location}" placeholder="Enter canteen location" required><br><br>

            <button type="submit">Update</button>
            <button type="button" onclick="window.location.href='/canteens';">Cancel</button>
        </form>
    </body>
</html>
