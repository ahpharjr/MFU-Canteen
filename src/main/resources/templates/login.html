<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="stylesheet" href="/styles/general.css">
</head>
<body>
    <div class="login-box">
        <div class="cover-photo">
            <img class="cover-img" src="/images/login-cover.gif">
            <div class="cover-text"><span class="text-1">Log In</span> 
                <br><span class="text-2">Please Sign in to your existing account</span>
            </div>
        </div>
        <div>
            <p class="input-name">Email</p>
            <input class="input-email" type="email" placeholder="Enter your Email">
            
            <p class="input-name">Password</p>
            <input class="input-password" type="text" placeholder="Enter your Password">
        </div>
        <div class="check-box-div">
            <div class="check-box">
                <input class="check" type="checkbox">
                <label for="remember">Remember me</label>
            </div>
            <div class="forget-pw">
                Forgot Password?
                <!-- <a href="forgetpw.html" class="forget-link">Forgot Password?</a> -->
            </div>
        </div>
        <button class="login-button">LOG IN</button>
        <div class="text-box">
            <div>Don't have an account? <span class="text-3">SIGN UP</span></div>
            <p>Or</p>
        </div>
        <div class="app-logo">
            <img class="fb-logo" src="/icons/icons8-facebook-64.png">
            <img class="line-logo" src="/icons/icons8-line-48.png">
            <img class="google-logo" src="/icons/icons8-google-48.png">
        </div>
    </div>
</body>
</html>
