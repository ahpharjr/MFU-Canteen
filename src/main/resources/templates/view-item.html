<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Item</title>
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/view-item-box.css">
    <link rel="stylesheet" href="/styles/home.css">
    <link rel="stylesheet" href="/styles/fav-add-btn.css">
    <link rel="stylesheet" href="/styles/nav.css">
    <style>
        body{
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="hleft">
            <div>Location:</div>
            <div th:text="${item.shop.canteen.name}" class="selected-canteen-name"></div>
        </div>
        <div class="hright">
            <div class="left-section">
                <div class="custom-circle-text">Find the <br> Food around you</div>
                <img class="custom-circle" src="/images/Ellipse 1220.png" alt="Custom Circle">
            </div>
            <div class="middle-section">
                <div class="search-icon"><img src="/icons/icons8-search-50 (1).png"></div>
                <div class="input-search">
                    <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchItems()">
                </div>                
            </div>        
            <div class="right-section">
                <div class="cart-icon">
                    <span class="cart-total-qty" th:text="${totalQuantity}">0</span>
                    <a th:href="@{'/user/'+${userId}+'/cart'}"><img src="/icons/cart.png"></a>
                </div>
                <div class="bell-icon"><img src="/icons/BELL NOTI.png"></div>
                <div class="profile-button"><img src="/icons/profile.png"></div>
            </div>
        </div>
    </div>
        <!-- Navigation Bar -->
        <div class="div-nav-bar">
            <div class="nav-button">
                <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon"><img  src="/icons/icons8-home-48.png" alt="home button"></div></a>
                <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon1"><img  src="/icons/icons8-home-50.png" alt="home button"></div></a>
                <span class="home-tooltip">Home</span>
            </div>
            <div class="nav-button">
                <a th:href="@{'/user/'+${userId} + '/menu'}"><div class="nav-icon"><img  id="menu-icon" src="/icons/menu-icon-color.png" alt="home button"></div></a>
                <div class="nav-icon1"><img  id="menu-icon" src="/icons/menu-icon.png" alt="home button"></div>
                <span class="home-tooltip">Menu</span>
            </div>
            <div class="nav-button">
                <a th:href="@{'/user/'+ ${userId} +'/favorite'}"><div class="nav-icon"><img  src="/icons/icons8-heart-50 (1).png" alt="home button"></div></a>
                <div class="nav-icon1"><img  src="/icons/icons8-heart-50.png" alt="home button"></div>
                <span class="home-tooltip">Favorite</span>
            </div>
            <div class="nav-button">
                <a th:href="@{'/user/'+ ${userId} +'/orders'}"><div class="nav-icon"><img  id="history-icon" src="/icons/icons8-purchase-order-50.png" alt="home button"></div></a>
                <div class="nav-icon1"><img  id="history-icon" src="/icons/icons8-purchase-order-50 (2).png" alt="home button"></div>
                <span class="home-tooltip">Order</span>
            </div>
        </div>
    <div class="item-container">
        <div class="back-arrow">
            <a href="javascript:history.back()">
                <img src="/icons/icons8-back-50.png" alt="Back">
            </a>
        </div>
        <div class="cycles"><img src="/images/Group 39474 (1).png"></div>
        <div class="item-img"><img th:src="@{${item.imageUrl}}" alt="Item Image"></div>
        <div class="desc-box">
            <div class="top-box">
                <div class="price-box">
                    <div class="thai-baht-icon"><img src="/icons/icons8-thai-baht-24.png"></div> 
                    <span th:text="${#numbers.formatDecimal(item.price, 2, 2)}"></span>
                </div>
                <div class="rating">
                    <div>Ratings and Reviews: </div>
                    <div><img src="/images/rating-star.png"></div>
                </div>
                <div class="name" th:text="${item.name}"></div>
                <div class="description" th:text="${item.description}"></div>
            </div>
            <div class="bottom-box">
                <div class="seller-box">
                    <div class="seller">Sold by: <span class="seller-name" th:text="${sellerName}">Seller Name</span></div>
                </div>
                <div class="button-box">
                    <div class="add-to-cart">
                        <form th:action="@{'/user/'+ ${userId} +'/cart'}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.itemId}"/> 
                            <button type="submit" class="add-to-cart-button">Add to Cart</button>
                        </form>
                    </div>
                </div>                
            </div>
        </div>
    </div>
    <div class="similar-food-container">
        <div class=custom-circle2><img src="/images/Group 39474 (1).png" alt="custom"></div>
        <div class="recommended-text">Similar Dishes</div>
        <div class="food-container1">
            <th:block th:each="similarItem : ${similarItems}">
                <div class="recommended-food-box" th:attr="onclick='viewItem(' + ${similarItem.itemId} + ')'">
                    <div class="add-to-favorite">
                        <div class="heart-shape">
                            <img 
                            class="heart-icon" 
                            th:src="${similarItem.isFavorite ? '/icons/icons8-heart-50 (1).png' : '/icons/icons8-heart-50.png'}" 
                            alt="Favorite Icon"
                            th:attr="onclick='toggleFavorite(' + ${similarItem.itemId} + ', this, event)'"
                            />
                        </div>                    
                        <span class="favorite-tooltip">Add to Favorite</span>
                    </div>
                    <div class="add-btn">
                        <div class="add-button" th:data-item-id="${similarItem.itemId}" onclick="addToCart(this, event); event.stopPropagation()">
                            +
                            <span class="cart-tooltip">Add to Cart</span>
                        </div>
                    </div>
                    <div class="item-pic">
                        <img th:src="${similarItem.imageUrl}" alt="Similar Dish Image">
                    </div>
                    <div class="item-title">
                        <div class="item-name">
                            <div class="dish-name" th:text="${similarItem.name}"></div>
                            <div class="div-rating-star">
                                <img src="/images/5stars.png">
                            </div>
                        </div>
                        <div class="item-price">
                            <img class="thai-baht-icon" src="/icons/icons8-thai-baht-24.png">
                            <span th:text="${#numbers.formatDecimal(similarItem.price, 2, 2)}">80.00</span>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
    
    <input type="hidden" id="userIdField" th:value="${userId}">
    <script> const userId = document.getElementById("userIdField").value;</script>
    <script src="/script/home.js"></script>
</body>
</html>
