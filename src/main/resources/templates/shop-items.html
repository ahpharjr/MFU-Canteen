<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items in Shop</title>
</head>
<body>
    <h1>Items in Shop: <span th:text="${shop.name}"></span></h1>
    <table>
        <thead>
            <tr>
                <th>Item Name</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.availability ? 'Available' : 'Not Available'}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
