<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/cart.css">
    <title>Your Cart</title>
</head>
<body>
    <div class="cart-container">
        <div class="back-arrow">
            <a href="javascript:history.back()">
                <img src="/icons/icons8-back-50.png" alt="Back">
            </a>
        </div>
        <div class="cycles"><img src="/images/Group 39474 (1).png"></div>
        <div class="cart-quantity">
            Your Cart (<span th:text="${cart.totalQuantity}">0</span>)
        </div>
        <div class="cart-title">
            <div class="dish">Dish</div>
            <div class="shop">Shop</div>
            <div class="amount">Amount</div>
            <div class="price">Price</div>
        </div>
        <div class="dish-box" th:each="cartItem : ${cart.cartItems}">
            <div class="selected-dish-box">
                <div class="selected-dish">
                    <div class="custom-checkbox">
                        <input type="checkbox" id="bullet1" />
                        <label for="bullet1"></label>
                    </div>
                    <div class="dish-picture">
                        <img th:src="@{${cartItem.item.imageUrl}}">
                    </div>
                    <div class="dish-desc">
                        <span class="name" th:text="${cartItem.item.name}"></span>
                    </div>
                </div>
                <div class="shop-no" th:text="${cartItem.item.shop.shopId}"></div>
                <div class="dish-amount">
                    <div id="deduct">-</div>
                    <div id="quantity" th:text="${cartItem.quantity}">1</div>
                    <div id="add">+</div>
                </div>
                <div class="dish-price">
                    <div class="d-price" th:text="${cartItem.item.price}">
                        <div class="thai-baht-icon"><img src="/icons/icons8-thai-baht-24.png"></div>
                    </div>
                    <div class="delete-button"><img src="/icons/icons8-delete-24.png"></div>
                </div>
            </div>
        </div>
        
        

        <div class="div-check-out">
            <div class="check-out-button">Check Out (5)</div>
        </div>
    </div>
</body>
</html>
