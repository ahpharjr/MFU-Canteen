<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/cart.css">
    <link rel="stylesheet" href="/styles/nav.css">
    <link rel="stylesheet" href="/styles/header.css">
    <title>Your Cart</title>
</head>
<body>
    <div class="header">
        <div class="hleft">
            <div>Location:</div>
            <div class="selected-canteen-name" th:text="${firstCartItem != null ? firstCartItem.item.shop.canteen.name : ''}"></div>
        </div>
        <div class="hright">
            <div class="left-section">
                <div class="custom-circle-text">Find the <br> Food around you</div>
                <img class="custom-circle" src="/images/Ellipse 1220.png" alt="Custom Circle">
            </div>
            <div class="middle-section">
                <div class="search-icon"><img src="/icons/icons8-search-50 (1).png"></div>
                <div class="input-search"><input type="text" placeholder="Search..."></div>
            </div>
            <div class="right-section">
                <div class="cart-icon">
                    <span class="cart-total-qty" th:text="${totalQuantity}">0</span>
                    <a th:href="@{'/user/'+${userId}+'/cart'}"><img src="/icons/cart.png"></a>
                </div>
                <div class="bell-icon"><img src="/icons/BELL NOTI.png"></div>
                <div class="profile-button"><img src="/icons/profile.png"></div>
            </div>
        </div>
    </div>
    <div class="div-nav-bar">
        <div class="nav-button">
            <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon"><img src="/icons/icons8-home-48.png" alt="home button"></div></a>
            <a th:href="@{'/user/'+ ${userId} + '/home'}"><div class="nav-icon1"><img src="/icons/icons8-home-48.png" alt="home button"></div></a>
        </div>
        <div class="nav-button">
            <div class="nav-icon"><img id="menu-icon" src="/icons/menu-icon-color.png" alt="menu button"></div>
            <div class="nav-icon1"><img id="menu-icon" src="/icons/menu-icon.png" alt="menu button"></div>
        </div>
        <div class="nav-button">
            <div class="nav-icon"><img src="/icons/icons8-heart-50 (1).png" alt="heart button"></div>
            <div class="nav-icon1"><img src="/icons/icons8-heart-50.png" alt="heart button"></div>
        </div>
        <div class="nav-button">
            <a th:href="@{'/user/'+ ${userId} + '/orders'}">
                <img  id="history-icon" src="/icons/history-icon.png" alt="home button"></div>
            </a><div class="nav-icon">
            <!-- <div class="nav-icon1"><img id="history-icon" src="/icons/history-icon.png" alt="history button"></div> -->
        </div>
    </div>
    <!-- Empty Cart Message -->
    <div class="display-message" th:if="${isCartEmpty}">
        <img class="empty-cart" src="/images/empty_cart.png" alt="Empty Cart">
        <span class="empty-cart-msg">Your cart is empty!</span>
        <a th:href="@{'/user/'+ ${userId} + '/home'}">Add Item</a>
    </div>
    <div th:unless="${isCartEmpty}">
        <div class="cart-container">
            <div class="back-arrow">
                <a onclick="window.history.back();">
                    <img src="/icons/icons8-back-50.png" alt="Back">
                </a>
            </div>
            <div class="cycles"><img src="/images/Group 39474 (1).png"></div>
            <div class="cart-quantity">
                Cart Item (<span th:text="${totalQuantity}">0</span>)
            </div>
            <div class="cart-title">
                <div class="dish">Dish</div>
                <div class="shop">Shop</div>
                <div class="amount">Quantity</div>
                <div class="price">Price</div>
            </div>
            
            <div class="dish-box" th:each="cartItem : ${cart.cartItems}">
                <div class="selected-dish-box">
                    <div class="selected-dish">
                        <div class="custom-checkbox">
                            <input type="checkbox" class="item-checkbox" th:data-id="${cartItem.id}" th:data-price="${cartItem.item.price}" th:data-quantity="${cartItem.quantity}" onchange="updateSummary()" />
                            <label></label>
                        </div>
                        <div class="dish-picture">
                            <img th:src="@{${cartItem.item.imageUrl}}">
                        </div>
                        <div class="dish-desc">
                            <span class="name" th:text="${cartItem.item.name}"></span>
                        </div>
                    </div>
                    <div class="shop-no" th:text="${cartItem.item.shop.shopNum}"></div>
                    <div class="dish-amount">
                        <!-- Decrease Button -->
                        <button type="button" class="decrease-btn" 
                                th:attr="onclick='decreaseQuantity(' + ${cartItem.id} + ')'" >-</button>
                        <!-- Quantity Display -->
                        <div type="button" th:id="'quantity-' + ${cartItem.id}" th:text="${cartItem.quantity}"></div>
                        <!-- Increase Button -->
                        <button type="button" class="increase-btn" 
                                th:attr="onclick='increaseQuantity(' + ${cartItem.id} + ')'" >+</button>
                    </div>
                    <div class="dish-price">
                        <div id="dish-price">
                            <div class="thai-baht-icon"><img src="/icons/icons8-thai-baht-24.png"></div>
                            <div class="d-price item-price" th:text="${cartItem.item.price}"></div>
                        </div>
                        <div class="delete-button">
                            <button type="button" class="delete-btn" 
                                    th:attr="onclick='deleteItem(' + ${cartItem.id} + ')'" >
                                <img src="/icons/icons8-delete-24.png">
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary Box (Only One Instance) -->
            <div class="checkout-summary">
                <div class="checkout-summary-box">
                    <h2>Check Out Summary</h2>
                    <div class="summary-item">
                        <span>Total Quantity:</span>
                        <span id="summary-quantity">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Total Price:</span>
                        <span>
                            <span class="baht-icon"><img src="/icons/icons8-thai-baht-24.png"><span id="summary-price">0.00</span></span>
                        </span>
                    </div>
                    <div class="div-check-out">
                        <form id="checkoutForm" th:action="@{'/user/' + ${userId} + '/cart/checkout'}" method="post">
                            <button type="button" class="check-out-button" id="checkout-button" onclick="submitCheckoutForm()">
                                Check Out (<span id="summary-quantity-button">0</span>) Items
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="hidden" id="userIdField" th:value="${userId}" />
    <script>
        function updateCartTotal(totalQuantity) {
            // Update the header's cart quantity
            const cartQtyElement = document.querySelector('.cart-total-qty');
            if (cartQtyElement) {
                cartQtyElement.textContent = totalQuantity;
            }

            // Update the "Cart Item" display
            const cartItemCountElement = document.querySelector('.cart-quantity span');
            if (cartItemCountElement) {
                cartItemCountElement.textContent = totalQuantity;
            }
        }
    
        // Increase item quantity
        function increaseQuantity(cartItemId) {
            const userId = document.getElementById('userIdField').value;
    
            fetch(`/user/${userId}/cart/ajax-increase?cartItemId=${cartItemId}`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                if (data.quantity !== undefined) {
                    document.getElementById(`quantity-${cartItemId}`).textContent = data.quantity;
                }
                if (data.totalQuantity !== undefined) {
                    updateCartTotal(data.totalQuantity);
                }
            })
            .catch(error => console.error('Error:', error));
        }
    
        // Decrease item quantity
        function decreaseQuantity(cartItemId) {
            const userId = document.getElementById('userIdField').value;
    
            fetch(`/user/${userId}/cart/ajax-decrease?cartItemId=${cartItemId}`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                if (data.quantity !== undefined) {
                    const quantityElement = document.getElementById(`quantity-${cartItemId}`);
                    if (data.quantity === 0) {
                        quantityElement.closest('.selected-dish-box').remove();
                    } else {
                        quantityElement.textContent = data.quantity;
                    }
                }
                if (data.totalQuantity !== undefined) {
                    updateCartTotal(data.totalQuantity);
                }
            })
            .catch(error => console.error('Error:', error));
        }
    
        // Delete item from cart
        function deleteItem(cartItemId) {
            const userId = document.getElementById('userIdField').value;
    
            fetch(`/user/${userId}/cart/ajax-delete?cartItemId=${cartItemId}`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                const itemElement = document.getElementById(`quantity-${cartItemId}`);
                if (itemElement) {
                    itemElement.closest('.selected-dish-box').remove();
                }
                if (data.totalQuantity !== undefined) {
                    updateCartTotal(data.totalQuantity);
                }
            })
            .catch(error => console.error('Error:', error));
        }

    </script>
    
    <script src="/script/cart.js"></script>
</body>
</html>
