<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Item</title>
</head>
<body>
    <h1>Add Item to Shop</h1>
    <form th:action="@{'/owner/item/add/' + ${shopId}}" th:object="${item}" method="post" enctype="multipart/form-data">
        <label for="name">Item Name:</label>
        <input type="text" id="name" th:field="*{name}" required>
        <br>
        <label for="price">Price:</label>
        <input type="number" id="price" th:field="*{price}" required>
        <br>
        <label for="category">Category:</label>
        <select id="category" th:field="*{category}" required>
            <option value="">Select Category</option>
            <option value="Chicken Rice">Chicken Rice</option>
            <option value="Rice Bowls">Rice Bowls</option>
            <option value="Noodles">Noodles</option>
            <option value="Grilled & BBQ">Grilled & BBQ</option>
            <option value="Small Bites/Snacks">Small Bites/Snacks</option>
            <option value="Spicy Salad">Spicy Salad</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Bubble Tea">Bubble Tea</option>
            <option value="Juice/Smoothies">Juice/Smoothies</option>
            <option value="Drinks">Drinks</option>
        </select>
        <br>
        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}" required>
        <br>
        <label for="availability">Available:</label>
        <input type="checkbox" id="availability" th:field="*{availability}">
        <br>
        <label for="image">Image:</label>
        <input type="file" id="image" name="image" required>
        <br><br>
        <button type="submit">Add Item</button>
    </form>
    <p><a th:href="@{'/owner/shop/' + ${shopId} + '/items'}">Back to Items</a></p>
</body>

</html>
