<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Item</title>
</head>
<body>
    <h1>Add Item to Shop</h1>
    <form th:action="@{'/owner/item/add/' + ${shopId}}" th:object="${item}" method="post" enctype="multipart/form-data">
        <label for="name">Item Name:</label>
        <input type="text" id="name" th:field="*{name}" required>
        <br>
        <label for="price">Price:</label>
        <input type="number" id="price" th:field="*{price}" required>
        <br>
        <label for="category">Category:</label>
        <input type="text" id="category" th:field="*{category}" required>
        <br>
        <label for="availability">Available:</label>
        <input type="checkbox" id="availability" th:field="*{availability}">
        <br>
        <label for="image">Image:</label>
        <!-- <input type="file" id="image" name="image" required> -->
        <input type="file" id="image" name="image">
        <br><br>
        <button type="submit">Add Item</button>
    </form>
    <p><a th:href="@{'/owner/shop/' + ${shopId} + '/items'}">Back to Items</a></p>
</body>

</html>
