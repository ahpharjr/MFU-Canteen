<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pictures</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        img {
            width: 100px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Pictures</h1>
    <p><a th:href="@{/picture/add}">Add Picture</a></p>
    <table>
        <thead>
            <th>Picture</th>
            <th>Name</th>
        </thead>
        <tbody>
            <tr th:each="picture : ${pictures}">
                <td>
                    <img th:src="@{'/uploads/' + ${picture.fileName}}" alt="Picture" style="width:100px;height:100px;">
                </td>
                <td th:text="${picture.pictureName}">Name</td>
                <td>
                    <a th:href="@{/picture/edit/{id}(id=${picture.pictureId})}">Edit</a>
                    
                    <form th:action="@{/picture/delete/{id}(id=${picture.pictureId})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this picture?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
