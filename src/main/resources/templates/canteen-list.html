<!DOCTYPE html>
<html>
    <head>
        <title>Canteen List</title>
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
            }
            table, th, td {
                border: 1px solid black;
            }
            th, td {
                padding: 10px;
                text-align: left;
            }
            img {
                width: 100px;
                height: auto;
            }
        </style>
    </head>
    <body>
        <h1>List of Canteens</h1>
        <p><a th:href="@{/ad/canteen/add}">Add Canteen</a></p>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="canteen : ${canteens}">
                    <td th:text="${canteen.name}">Canteen Name</td>
                    <td th:text="${canteen.location}">Canteen Location</td>

                    <td><a th:href="@{'/ad/canteen/shops/' + ${canteen.canteenId}}">View Shops</a></td>
                    <td><a th:href="@{'/ad/canteen/edit/' + ${canteen.canteenId}}">Edit</a></td>
                    <td>
                        <form th:action="@{'/ad/canteen/delete/'+ ${canteen.canteenId}}" method="post" onsubmit="return confirm('Are you sure you want to delete?');">
                            <button type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <h1>List of Owners</h1>
        <p><a th:href="@{/ad/owner/add}">Add Owner</a></p> <!-- Button to add a new owner -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="owner : ${owners}">
                    <td th:text="${owner.name}">Owner Name</td>
                    <td th:text="${owner.email}">Owner Email</td>
                    <td th:text="${owner.phNum}">Phone Number</td>
                    <td><a th:href="@{'/ad/owner/edit/' + ${owner.ownerId}}">Edit</a></td>
                    <td>
                        <form th:action="@{'/ad/owner/delete/'+ ${owner.ownerId}}" method="post" onsubmit="return confirm('Are you sure you want to delete this owner?');">
                            <button type="submit">Delete</button>
                        </form>
                        <!-- <form th:action="@{'/owner/delete/' + ${owner.ownerId}}" method="post" onsubmit="return confirm('Are you sure you want to delete this owner?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit">Delete</button>
                        </form> -->
                        
                    </td>
                </tr>
            </tbody>
        </table>


    </body>
</html>
